// Rust Elytra Client

plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenLocal()
    // Nether path finder来源
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 暂时使用yarn mappings,以后迁移到官方映射?
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "dev.rstminecraft:RustClientCore:1.3-SNAPSHOT", { changing = true }
    include "dev.rstminecraft:RustClientCore:1.3-SNAPSHOT", { changing = true }

    implementation "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
    include "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand([version: inputs.properties.version])
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Java21
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("remapJar") {
    def mcVersion = project.property("minecraft_version")
    def baseName = project.property("archives_base_name")
    def modVersion = project.property("mod_version")

    archiveBaseName = "${mcVersion}/${baseName}-${mcVersion}"
    archiveVersion = ("${modVersion}")
}

tasks.named("remapSourcesJar") {
    def mcVersion = project.property("minecraft_version")
    def baseName = project.property("archives_base_name")
    def modVersion = project.property("mod_version")

    archiveBaseName = "${mcVersion}/${baseName}-${mcVersion}"
    archiveVersion = ("${modVersion}")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // 暂无上传所需仓库
    }
}

loom {
    accessWidenerPath = file("src/main/resources/rust-elytra-client.accesswidener")
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}


def cleanLoomRustCache() {
    def loomCacheDir = file("${project.rootDir}/.gradle/loom-cache")
    if (!loomCacheDir.exists()) return

    loomCacheDir.eachFileRecurse { file ->
        def fileName = file.name.toLowerCase()
        if (fileName.endsWith('.jar') && fileName.contains('rustclientcore') && fileName.contains('snapshot')) {
            try {
                if (file.exists() && file.delete()) {
                    logger.lifecycle("====== [Fabric Rust] 删除重映射缓存: ${file.name} ======")
                }
            } catch (Exception ignored) {
                logger.log(LogLevel.WARN, "====== [Fabric Rust] 警告：文件被占用: ${file.name} ======")

            }
        }
    }
}

cleanLoomRustCache()